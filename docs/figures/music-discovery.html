<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThinkOS 音乐交互原型</title><style>:root{color-scheme:light dark;font:18px system-ui}*{box-sizing:border-box}body{margin:auto;max-width:920px;padding:16px}nav,footer{display:flex;gap:8px;align-items:center}button,input{font:inherit;border:1px solid GrayText;border-radius:12px;padding:10px;min-height:48px;color:inherit;background:transparent}button{cursor:pointer}button[aria-pressed=true],.feature{background:color-mix(in srgb,Highlight 14%,Canvas)}main{margin:16px 0 90px}.layout{display:grid;gap:18px;grid-template-columns:2fr 3fr}.feature{text-align:start;padding:20px;font-weight:600}.feature strong{font-size:32px;display:block;margin:12px 0}small{display:block;opacity:.8}.rows{display:grid;gap:6px}.rows button{text-align:start}footer{position:sticky;bottom:0;background:Canvas;padding:8px 0}footer button:first-child{flex:1;text-align:start}h1{font-size:32px}h2{font-size:18px}button:focus-visible{outline:3px solid Highlight}@media(max-width:600px){.layout{grid-template-columns:1fr}nav button{flex:1}}</style><nav><button id="discover">发现</button><button id="library">资料库</button><button id="search">搜索</button></nav><main id="panel"></main><footer id="bar"></footer><script>const songs=[["Carefree","Light"],["Sneaky Snitch","Comedic"],["Fluffing a Duck","Comedic"],["Local Forecast - Elevator","Jazz"],["Pookatori and Friends","Video Classica"],["Cipher",""],["Wallpaper",""],["Scheming Weasel (faster version)","Comedic"]];let current=-1,playing=false,screen="发现",origin=screen,word="",scrollRestore=0,category="本地音乐";const panel=document.querySelector("main"),bar=document.querySelector("footer");function button(text,act,parent,cls){const el=document.createElement("button");el.textContent=text;el.onclick=act;el.className=cls||"";parent.append(el);return el}function play(i){current=i;playing=true;render()}function openFull(){origin=screen;scrollRestore=scrollY;screen="正在播放";render()}function back(){if(screen==="待播")screen="正在播放";else screen=origin;render();if(screen===origin)scrollTo(0,scrollRestore)}function render(){panel.replaceChildren();bar.replaceChildren();[discover,library,search].forEach(b=>b.setAttribute("aria-pressed",b.textContent===screen));if(screen==="正在播放"||screen==="待播"){button("返回",back,panel);if(screen==="正在播放"){const h=document.createElement("h1");h.textContent=songs[current][0];panel.append(h,"Kevin MacLeod / "+songs[current][1]);button("待播",()=>{screen="待播";render()},panel)}else songs.forEach((s,i)=>button((i===current?"▶ ":"")+s[0],()=>play(i),panel));}else if(screen==="资料库"){["本地音乐","最近播放","视频","网络流"].forEach(name=>{const choice=button(name,()=>{category=name;render()},panel);choice.setAttribute("aria-pressed",String(name===category))});const h=document.createElement("h2");h.textContent=category;panel.append(h);if(category==="最近播放"&&current>=0)button(songs[current][0],()=>play(current),panel);else panel.append("暂无内容")}else{const area=document.createElement("div"),rows=document.createElement("div");area.className="layout";rows.className="rows";if(screen==="发现"){const card=button("精选",()=>play(0),area,"feature");const h=document.createElement("strong");h.textContent=songs[0][0];card.append(h,"Kevin MacLeod / Light　▶")}else{const input=document.createElement("input");input.placeholder="歌曲或艺人";input.value=word;input.oninput=()=>{word=input.value;fill()};area.append(input)}function fill(){rows.replaceChildren();songs.forEach((s,i)=>{if(screen==="发现"?i===0:!(s.join(" ")+" Kevin MacLeod").toLowerCase().includes(word.toLowerCase()))return;const b=button(s[0],()=>play(i),rows);const m=document.createElement("small");m.textContent="Kevin MacLeod"+(s[1]?" / "+s[1]:"");b.append(m)})}fill();area.append(rows);panel.append(area)}if(current>=0){button(songs[current][0],()=>{if(screen!=="正在播放"&&screen!=="待播")openFull()},bar);button(playing?"暂停":"播放",()=>{playing=!playing;render()},bar);button("下一首",()=>play((current+1)%songs.length),bar)}}[discover,library,search].forEach(b=>b.onclick=()=>{screen=b.textContent;render()});render()</script></html>
